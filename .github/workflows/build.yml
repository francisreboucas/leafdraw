# Gera o LeafDraw para Linux e macOS e, em tag v*, anexa os pacotes à release da tag (cria um rascunho se não houver)
# e atualiza o SHA256SUMS.txt (workflow sha256sums.yml).
# O Windows continua com packaging/build.ps1 local: os runners Windows não têm OpenGL 3.3 para o autoteste.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # glibc 2.35: roda no Ubuntu 22.04+, Debian 12+, Fedora 36+
          - os: macos-14            # Apple Silicon (arm64)
          - os: macos-15-intel      # Intel (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libfontconfig1 libdbus-1-3

      - name: Ambiente Python
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]" pyinstaller

      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest -q

      - name: Empacotar
        run: bash packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: leafdraw-${{ matrix.os }}
          path: |
            dist/LeafDraw-*.tar.gz
            dist/LeafDraw-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --prerelease --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" pacotes/* -R "$GITHUB_REPOSITORY" --clobber

  sha256sums:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/sha256sums.yml
    with:
      tag: ${{ github.ref_name }}
